<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Valorant Weapons</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5">
    <h1 class="mb-4 text-center">Valorant Weapons</h1>
    <form method="get" action="/" class="mb-4 text-center">
      <label for="sort_by" class="form-label fw-bold">Sort by:</label>
      <select name="sort_by" id="sort_by" class="form-select d-inline w-auto mx-2">
        <option value="cost" {% if request.args.get('sort_by') == 'cost' %}selected{% endif %}>Cost</option>
        <option value="fire_rate" {% if request.args.get('sort_by') == 'fire_rate' %}selected{% endif %}>Fire Rate</option>
        <option value="accuracy" {% if request.args.get('sort_by') == 'accuracy' %}selected{% endif %}>First Bullet Accuracy</option>
      </select>
      <button type="submit" class="btn btn-secondary">Sort</button>
    </form>

    <div class="row">
      {% for weapon in weapons %}
      <div class="col-md-4 mb-4 d-flex align-items-stretch">
        <div class="card h-100">
          <img src="{{ weapon.icon }}" class="card-img-top" alt="{{ weapon.name }}">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ weapon.name }}</h5>
            <p class="card-text mb-1"><strong>Cost:</strong> {{ weapon.weapon_cost }}</p>
            <p class="card-text mb-1"><strong>Fire Rate:</strong> {{ weapon.fire_rate }}</p>
            <p class="card-text"><strong>Accuracy:</strong> {{ weapon.accuracy }}</p>
            <a href="/weapon/{{ weapon.id }}" class="btn btn-primary mt-auto">View Details</a>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
