<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Valorant Weapons</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5">
    <h1 class="mb-4 text-center">Valorant Weapons</h1>
    <div class="row">
      {% for weapon in weapons %}
      <div class="col-md-4 mb-4 d-flex align-items-stretch">
        <div class="card h-100">
          <img src="{{ weapon.icon }}" class="card-img-top" alt="{{ weapon.name }}">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ weapon.name }}</h5>
            <p class="card-text">A weapon from Valorant.</p>
            <a href="/weapon/{{ weapon.id }}" class="btn btn-primary mt-auto">View Details</a>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
